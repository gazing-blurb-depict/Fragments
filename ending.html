<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ARE YOU THERE? — Someone</title>
  <link rel="stylesheet" href="style.css">
  <script src="game.js" defer></script>
</head>
<body data-page="ending">
  <main class="screen ending-screen">
    <p class="eyebrow">UNKNOWN SIGNAL // 004</p>
    <div class="ending-mark" aria-hidden="true">✳</div>
    <p class="speaker" id="endingName">SOMEONE</p>
    <h1 class="dialogue glitch" id="endingTitle">I think... I'm here.</h1>
    <p class="ending-text" id="endingText">The voice is no longer quite so far away.</p>
    <div class="summary" id="identitySummary"></div>
    <button class="choice-button" id="memoryButton">[ REMIND ME WHO I AM ]</button>
    <button class="choice-button" id="restartButton">[ BEGIN AGAIN ]</button>
    <footer>END OF FIRST SIGNAL <span class="blink">_</span></footer>
  </main>
</body>
</html>
